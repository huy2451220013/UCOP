<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ví điện tử UCOP Wallet')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container my-4">
    <h4 class="fw-bold mb-3"><i class="bi bi-wallet2 text-primary me-2"></i>SV4: Ví Điện Tử Nội Bộ UCOP (Wallet &amp; Transactions)</h4>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card text-white mb-3" style="background: linear-gradient(135deg, #0f766e 0%, #059669 100%);">
                <div class="card-body p-4">
                    <div class="small text-uppercase opacity-75">Số dư khả dụng hiện tại</div>
                    <div class="display-6 fw-bold my-2"
                         th:text="${#numbers.formatDecimal(wallet.balance, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</div>
                    <hr class="border-light opacity-25">
                    <div class="d-flex justify-content-between small">
                        <span>Tổng nạp/hoàn: <strong th:text="${#numbers.formatDecimal(wallet.totalDeposited, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></strong></span>
                        <span>Đã chi: <strong th:text="${#numbers.formatDecimal(wallet.totalSpent, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></strong></span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header py-3">
                    <i class="bi bi-plus-circle text-success me-2"></i>Nạp thêm tiền vào Ví UCOP
                </div>
                <div class="card-body">
                    <form th:action="@{/payment/wallet/deposit}" method="post">
                        <div class="mb-2">
                            <label class="form-label small fw-semibold">Số tiền nạp (VNĐ) *</label>
                            <input type="number" name="amount" id="depositAmt" value="500000" min="10000" step="10000" class="form-control" required>
                        </div>
                        <div class="d-flex flex-wrap gap-1 mb-3">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('depositAmt').value=200000">200,000đ</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('depositAmt').value=500000">500,000đ</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('depositAmt').value=2000000">2,000,000đ</button>
                        </div>
                        <button type="submit" class="btn btn-success w-100 fw-semibold">
                            <i class="bi bi-lightning-charge me-1"></i>Nạp tiền ngay
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-header py-3">Lịch sử Biến động Số dư (DEPOSIT / PAYMENT / REFUND)</div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0 small">
                        <thead class="table-light">
                        <tr>
                            <th>Thời gian</th>
                            <th>Loại GD</th>
                            <th>Nội dung</th>
                            <th class="text-end">Số tiền</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="tx : ${transactions}">
                            <td th:text="${tx.createdAt != null ? #temporals.format(tx.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${tx.txType == 'DEPOSIT' ? 'bg-success' : (tx.txType == 'REFUND' ? 'bg-info text-dark' : 'bg-warning text-dark')}"
                                      th:text="${tx.txType}"></span>
                            </td>
                            <td th:text="${tx.description}">Mô tả</td>
                            <td class="text-end fw-bold"
                                th:classappend="${tx.txType == 'PAYMENT' ? 'text-danger' : 'text-success'}"
                                th:text="${(tx.txType == 'PAYMENT' ? '-' : '+') + #numbers.formatDecimal(tx.amount, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td>
                        </tr>
                        <tr th:if="${transactions.isEmpty()}">
                            <td colspan="4" class="text-center py-4 text-muted">Chưa có giao dịch ví nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thông báo lỗi')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container my-5 text-center">
    <div class="card mx-auto p-5" style="max-width: 620px;">
        <div class="text-warning display-1 mb-3"><i class="bi bi-exclamation-octagon-fill"></i></div>
        <h3 class="fw-bold">Đã xảy ra lỗi khi xử lý yêu cầu</h3>
        <p class="text-danger fw-semibold my-2" th:text="${errorMessage != null ? errorMessage : 'Lỗi hệ thống'}"></p>
        <p class="small text-muted" th:if="${requestUri != null}">Đường dẫn: <code th:text="${requestUri}"></code></p>
        <div class="mt-3">
            <a th:href="@{/}" class="btn btn-primary"><i class="bi bi-arrow-left me-1"></i>Quay lại Trang chủ</a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

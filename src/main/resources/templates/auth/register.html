<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng ký tài khoản')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4">
                <h4 class="fw-bold mb-1"><i class="bi bi-person-plus-fill text-primary me-2"></i>Đăng ký Tài khoản Khách hàng</h4>
                <p class="text-muted small mb-3">Kiểm tra dữ liệu đầu vào bằng Bean Validation (@NotBlank, @Email, @Pattern)</p>

                <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Tên đăng nhập *</label>
                            <input type="text" th:field="*{username}" class="form-control" placeholder="4-30 ký tự chữ/số">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Mật khẩu *</label>
                            <input type="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Họ và tên *</label>
                            <input type="text" th:field="*{fullName}" class="form-control" placeholder="Nguyễn Văn A">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Số điện thoại *</label>
                            <input type="text" th:field="*{phone}" class="form-control" placeholder="0901234567">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Email *</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="email@example.com">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Địa chỉ nhận hàng mặc định</label>
                            <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, đường, quận/huyện, tỉnh/thành phố">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-4">
                        <i class="bi bi-check2-circle me-1"></i>Hoàn tất Đăng ký
                    </button>
                </form>

                <div class="text-center mt-3 small">
                    Đã có tài khoản? <a th:href="@{/login}">Đăng nhập tại đây</a>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Hồ sơ cá nhân & Đổi mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container my-4">
    <div class="row g-4">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header py-3">
                    <i class="bi bi-person-vcard text-primary me-2"></i>Thông tin Hồ sơ (Quan hệ 1-1: Account &harr; AccountProfile)
                </div>
                <div class="card-body">
                    <form th:action="@{/profile}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Tên đăng nhập</label>
                                <input type="text" class="form-control bg-light" th:value="${account.username}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small">Email</label>
                                <input type="text" class="form-control bg-light" th:value="${account.email}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Họ và tên *</label>
                                <input type="text" name="fullName" class="form-control"
                                       th:value="${account.profile != null ? account.profile.fullName : ''}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Số điện thoại</label>
                                <input type="text" name="phone" class="form-control"
                                       th:value="${account.profile != null ? account.profile.phone : ''}">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Địa chỉ giao hàng</label>
                                <input type="text" name="address" class="form-control"
                                       th:value="${account.profile != null ? account.profile.address : ''}">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary mt-3">
                            <i class="bi bi-save me-1"></i>Lưu thay đổi hồ sơ
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card">
                <div class="card-header py-3">
                    <i class="bi bi-shield-lock text-danger me-2"></i>Đổi Mật Khẩu (BCrypt Hash)
                </div>
                <div class="card-body">
                    <form th:action="@{/change-password}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu hiện tại *</label>
                            <input type="password" name="oldPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mật khẩu mới (tối thiểu 6 ký tự) *</label>
                            <input type="password" name="newPassword" class="form-control" minlength="6" required>
                        </div>
                        <button type="submit" class="btn btn-warning fw-semibold w-100">
                            <i class="bi bi-key-fill me-1"></i>Cập nhật mật khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

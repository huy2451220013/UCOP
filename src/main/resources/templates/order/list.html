<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách Đơn hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container my-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3">
        <div>
            <h4 class="fw-bold mb-0"><i class="bi bi-receipt-cutoff text-primary me-2"></i>SV3: Quản lý &amp; Tra cứu Đơn hàng</h4>
            <small class="text-muted">Lọc đơn hàng đa tiêu chí: Trạng thái + Khoảng ngày (From/To) + Khách hàng</small>
        </div>
        <a th:if="${isAdmin or isStaff}" th:href="@{/fulfillment}" class="btn btn-outline-success btn-sm">
            <i class="bi bi-truck me-1"></i>Xem tất cả Vận đơn &amp; Lịch hẹn
        </a>
    </div>

    <!-- Filter Form -->
    <div class="card mb-4">
        <div class="card-body py-3">
            <form th:action="@{/orders}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold mb-1">Trạng thái đơn</label>
                    <select name="status" class="form-select form-select-sm">
                        <option value="">-- Tất cả trạng thái --</option>
                        <option th:each="st : ${allStatuses}" th:value="${st}" th:text="${st}"
                                th:selected="${selectedStatus == st}"></option>
                    </select>
                </div>
                <div class="col-md-3" th:if="${isAdmin or isStaff}">
                    <label class="form-label small fw-semibold mb-1">Khách hàng</label>
                    <input type="text" name="customer" class="form-control form-control-sm"
                           placeholder="Username hoặc Họ tên..." th:value="${customer}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold mb-1">Từ ngày</label>
                    <input type="date" name="fromDate" class="form-control form-control-sm" th:value="${fromDate}">
                </div>
                <div class="col-md-2">
                    <label class="form-label small fw-semibold mb-1">Đến ngày</label>
                    <input type="date" name="toDate" class="form-control form-control-sm" th:value="${toDate}">
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <button type="submit" class="btn btn-primary btn-sm flex-grow-1"><i class="bi bi-funnel me-1"></i>Lọc</button>
                    <a th:href="@{/orders}" class="btn btn-outline-secondary btn-sm">Xóa</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Orders Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Mã đơn</th>
                    <th>Khách hàng</th>
                    <th>Ngày đặt</th>
                    <th>Số SP</th>
                    <th>Tổng thanh toán</th>
                    <th>Trạng thái</th>
                    <th class="text-end">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td><strong class="font-monospace text-primary" th:text="${o.orderCode}">ORD</strong></td>
                    <td>
                        <div class="fw-semibold" th:text="${o.account.profile != null ? o.account.profile.fullName : o.account.username}"></div>
                        <small class="text-muted" th:text="'@' + ${o.account.username}"></small>
                    </td>
                    <td class="small" th:text="${o.createdAt != null ? #temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                    <td th:text="${o.orderItems.size() + ' mục'}"></td>
                    <td class="fw-bold" th:text="${#numbers.formatDecimal(o.grandTotal, 0, 'COMMA', 0, 'POINT') + ' ₫'}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${o.status.name() == 'PAID' or o.status.name() == 'DELIVERED' or o.status.name() == 'CLOSED' ? 'bg-success' :
                                               (o.status.name() == 'CANCELED' or o.status.name() == 'REFUNDED' ? 'bg-danger' :
                                               (o.status.name() == 'RMA_REQUESTED' ? 'bg-warning text-dark' : 'bg-primary'))}"
                              th:text="${o.status}"></span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:if="${o.status.name() == 'PLACED' or o.status.name() == 'PENDING_PAYMENT'}"
                           th:href="@{/payment/checkout/{id}(id=${o.id})}"
                           class="btn btn-sm btn-success me-1">
                            <i class="bi bi-credit-card me-1"></i>Thanh toán
                        </a>
                        <a th:href="@{/orders/detail/{id}(id=${o.id})}" class="btn btn-sm btn-outline-primary">
                            Chi tiết &rarr;
                        </a>
                    </td>
                </tr>
                <tr th:if="${orders == null or orders.isEmpty()}">
                    <td colspan="7" class="text-center py-4 text-muted">Không có đơn hàng nào khớp điều kiện lọc.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

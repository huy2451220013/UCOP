# ===================================================================
# UCOP - Cloud / Render.com Profile (application-render.properties)
# Uses embedded H2 database + Render dynamic $PORT
# ===================================================================
server.port=${PORT:8088}

spring.datasource.url=jdbc:h2:mem:ucop_db;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE,USER,ORDER,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.use_nationalized_character_data=false

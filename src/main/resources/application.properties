# ===================================================================
# UCOP - Universal Commerce & Operations Platform
# Spring MVC + Thymeleaf + Hibernate/JPA + SQL Server Configuration
# ===================================================================
spring.application.name=UCOP
server.port=8088
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# SQL Server Connection (Local SQL Server / SQLEXPRESS TCP 1433)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ucop_db;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true
spring.datasource.username=ucop_user
spring.datasource.password=Ucop@123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# Thymeleaf View Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Multipart Upload (CSV Import)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
